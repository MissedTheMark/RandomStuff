<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Simulation - WebGL</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Fluid Simulation</h1>
        </div>
        
        <div class="main-content">
            <div class="left-column">
                <div class="canvas-container">
                    <canvas id="fluidCanvas" width="400" height="400"></canvas>
                </div>
                
                <div class="bottom-controls">
                    <div class="control-group">
                        <h3>Actions</h3>
                        
                        <div class="button-row">
                            <button id="startStopBtn">Start Simulation</button>
                            <button id="clearVelocityBtn">Clear Velocity</button>
                            <button id="resetBtn">Reset</button>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <h3>Status</h3>
                        <div id="statusInfo">
                            <p>Simulation: <span id="simStatus">Stopped</span></p>
                            <p>FPS: <span id="fpsCounter">0</span></p>
                            <p>Grid: <span id="gridSizeDisplay">256×256</span></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="controls-panel">
                <div class="control-group">
                    <h3>Instructions</h3>
                    <div class="instructions">
                        <p><strong>Left Mouse:</strong> Add velocity by dragging</p>
                        <p><strong>Right Mouse:</strong> Add density by clicking/dragging</p>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>Simulation Parameters</h3>
                    
                    <div class="control-row">
                        <label for="diffusionRate">Diffusion Rate:</label>
                        <div class="input-group">
                            <input type="range" id="diffusionRateSlider" value="1" min="0" max="50" step="1">
                            <input type="number" id="diffusionRate" value="1" min="0" max="50" step="1">
                        </div>
                        <span class="help-icon" data-tooltip="Controls how quickly density spreads out in the fluid. Higher values = faster spreading/diffusion. Typical range: 10-40 for realistic behavior.">❓</span>
                    </div>
                    
                    <div class="control-row">
                        <label for="viscosity">Viscosity:</label>
                        <div class="input-group">
                            <input type="range" id="viscositySlider" value="2.5" min="0" max="5" step="0.1">
                            <input type="number" id="viscosity" value="2.5" min="0" max="5" step="0.1">
                        </div>
                        <span class="help-icon" data-tooltip="Controls the 'thickness' or resistance of the fluid. Higher values = more viscous (thick, honey-like). Typical range: 0.5-2 for water-like fluids.">❓</span>
                    </div>
                    
                    <div class="control-row">
                        <label for="heatEffect">Heat Effect:</label>
                        <div class="input-group">
                            <input type="range" id="heatEffectSlider" value="2.5" min="0" max="50" step="0.1">
                            <input type="number" id="heatEffect" value="2.5" min="0" max="50" step="0.1">
                        </div>
                        <span class="help-icon" data-tooltip="Controls buoyancy effects - how density creates upward velocity. Higher values = stronger 'hot air rises' effect.">❓</span>
                    </div>
                    
                    <div class="control-row">
                        <label for="cutOff">Heat Threshold:</label>
                        <div class="input-group">
                            <input type="range" id="cutOffSlider" value="20" min="0" max="100" step="1">
                            <input type="number" id="cutOff" value="20" min="0" max="100" step="1">
                        </div>
                        <span class="help-icon" data-tooltip="Threshold for heat effect calculation. Higher values = more density needed before heat effect kicks in.">❓</span>
                    </div>
                    
                    <div class="control-row">
                        <label for="fluidSize">Fluid Intensity:</label>
                        <div class="input-group">
                            <input type="range" id="fluidSizeSlider" value="5" min="1" max="20" step="0.1">
                            <input type="number" id="fluidSize" value="5" min="1" max="20" step="0.1">
                        </div>
                        <span class="help-icon" data-tooltip="Controls the intensity/size of auto-added fluid. Higher values = more dense fluid added at bottom edge.">❓</span>
                    </div>
                    
                    <div class="control-row">
                        <label for="mouseVelocity">Mouse Velocity Multiplier:</label>
                        <div class="input-group">
                            <input type="range" id="mouseVelocitySlider" value="2" min="0.1" max="5" step="0.1">
                            <input type="number" id="mouseVelocity" value="2" min="0.1" max="5" step="0.1">
                        </div>
                        <span class="help-icon" data-tooltip="Amplifies the velocity added when dragging with left mouse. Higher values = stronger velocity from mouse movement.">❓</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>Performance</h3>
                    
                    <div class="control-row">
                        <label for="performanceMode">Performance Mode:</label>
                        <select id="performanceMode">
                            <option value="high">High Quality (30ms)</option>
                            <option value="balanced" selected>Balanced (50ms)</option>
                            <option value="performance">Performance (100ms)</option>
                        </select>
                        <span class="help-icon" data-tooltip="Controls simulation update frequency. High Quality = smoother but more CPU intensive. Performance = lower CPU usage but less smooth.">❓</span>
                    </div>
                    
                    <div class="control-row checkbox-row">
                        <input type="checkbox" id="adaptiveQuality" checked>
                        <label for="adaptiveQuality">Auto-adjust Performance</label>
                        <span class="help-icon" data-tooltip="Automatically switches to Performance mode if FPS drops below 30, and back to Balanced if FPS is good. Disabled when you manually change the Performance Mode.">❓</span>
                    </div>
                    
                    <div class="control-row">
                        <label for="gridSize">Grid Size:</label>
                        <select id="gridSize">
                            <option value="32">32×32 (Fast)</option>
                            <option value="64">64×64 (Balanced)</option>
                            <option value="128">128×128 (High Quality)</option>
                            <option value="256" selected>256×256 (Very High Quality)</option>
                        </select>
                        <span class="help-icon" data-tooltip="Controls the simulation grid resolution. Higher values = better detail but slower performance. Changing this will reset the simulation.">❓</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>Features</h3>
                    
                    <div class="control-row checkbox-row">
                        <input type="checkbox" id="enableDispersion" checked>
                        <label for="enableDispersion">Enable Diffusion</label>
                        <span class="help-icon" data-tooltip="Turns on/off the diffusion step. When OFF: density doesn't spread out naturally.">❓</span>
                    </div>
                    
                    <div class="control-row checkbox-row">
                        <input type="checkbox" id="enableHeat">
                        <label for="enableHeat">Enable Heat</label>
                        <span class="help-icon" data-tooltip="Turns on/off buoyancy effects. When ON: density creates upward velocity (hot air rises).">❓</span>
                    </div>
                    
                    <div class="control-row checkbox-row">
                        <input type="checkbox" id="dynamicVelocity" checked>
                        <label for="dynamicVelocity">Velocity Diffusion</label>
                        <span class="help-icon" data-tooltip="Controls velocity diffusion. When ON: full velocity diffusion (more realistic). When OFF: reduced diffusion (faster).">❓</span>
                    </div>
                    
                    <div class="control-row checkbox-row">
                        <input type="checkbox" id="autoAddFluid">
                        <label for="autoAddFluid">Auto-add Fluid</label>
                        <span class="help-icon" data-tooltip="Automatically adds fluid at top and bottom edges in the center for continuous testing.">❓</span>
                    </div>
                    
                    <div class="control-row checkbox-row">
                        <input type="checkbox" id="showVelocityVectors">
                        <label for="showVelocityVectors">Show Velocity Vectors</label>
                        <span class="help-icon" data-tooltip="Displays red lines showing velocity direction and magnitude. Helps visualize the flow field.">❓</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/fluidEngine.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
